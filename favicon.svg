<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sort 9 アイコン：4マスの盤面。1=正解済み(緑) / 2・9=表示中(藍) / 左下=隠れたマス -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g stroke-width="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="128" text-anchor="middle">
    <rect x="64" y="64" width="176" height="176" rx="36" fill="#065f46" stroke="#34d399"/>
    <text x="152" y="198" fill="#d1fae5" stroke="none">1</text>
    <rect x="272" y="64" width="176" height="176" rx="36" fill="#1e2a5a" stroke="#6366f1"/>
    <text x="360" y="198" fill="#ffffff" stroke="none">2</text>
    <rect x="64" y="272" width="176" height="176" rx="36" fill="#334155" stroke="#475569"/>
    <rect x="272" y="272" width="176" height="176" rx="36" fill="#1e2a5a" stroke="#6366f1"/>
    <text x="360" y="406" fill="#ffffff" stroke="none">9</text>
  </g>
</svg>
